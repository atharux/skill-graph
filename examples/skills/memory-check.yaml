skill: memory-check
source: commands/memory-check.md
purpose: Lint the memory store, fix what is malformed, and spot-check what it claims.
inputs: []
steps:
  - id: run-linter
    kind: script
    does: Run the memory validation script.
    tool: python
    effect: read
    touches: [{path: 'auto-memory/', mode: read}]
    in: []
    out: [{name: lint, type: object}]
    quote: 'python3 .claude/scripts/validate-memory.py'
  - id: fix-errors
    kind: script
    does: Fix every error the linter reports.
    tool: fs
    effect: local
    touches: [{path: 'auto-memory/', mode: write}]
    in: [lint]
    out: [{name: fixed, type: list}]
    quote: '**ERROR — always fix.** A malformed or unindexed memory actively misleads a future session:'
  - id: judge-warnings
    kind: judgment
    does: Decide which warnings are real, and convert relative dates to absolute ones.
    tool: fs
    effect: local
    touches: [{path: 'auto-memory/', mode: write}]
    in: [lint]
    out: [{name: warning_changes, type: list}]
    quote: '**WARN — judgement.** Relative dates are the ones that matter: "currently blocked", "recently'
  - id: spot-check
    kind: gate
    does: Check time-sensitive claims against the repos and files they describe.
    tool: git
    effect: read
    uses: fetch-before-read
    in: [fixed, warning_changes]
    out: [{name: wrong, type: list}]
    quote: 'The linter checks shape, not truth. Spot-check anything time-sensitive against reality before'
  - id: approve-deletions
    kind: approval
    does: List each memory file proposed for deletion, with a reason, and wait for a human to approve.
    tool: none
    effect: read
    in: [wrong]
    out: [{name: approved_deletions, type: list}]
    quote: 'own verdict: list each file you want to delete with a one-line reason, and delete'
  - id: delete-wrong
    kind: script
    destructive: true
    does: Delete the memory files the human approved.
    tool: fs
    effect: local
    touches: [{path: 'auto-memory/', mode: write}]
    in: [approved_deletions]
    out: [{name: deleted, type: list}]
    quote: 'only the ones he approves. Edits that fix shape or dates need no approval.'
  - id: report
    kind: report
    does: Report what changed and what was deliberately left.
    tool: none
    effect: read
    in: [fixed, warning_changes, deleted]
    out: []
    quote: 'Report what you changed and what you deliberately left. If the store is clean, say so in one'
notes:
  - Until 2026-10-13 memories were deleted on the model's own spot-check. The prose now lists them for approval before any file goes.
